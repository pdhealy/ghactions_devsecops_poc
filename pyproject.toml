[project]
name = "secure-gha-poc"
version = "0.1.0"
description = "Secure GitHub Actions PoC for Cloud Run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "gunicorn>=22.0.0,<23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.5.0,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
